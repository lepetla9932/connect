<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect — Find Your Match</title>
<style>
:root{
  --primary:#e91e63;
  --primary-2:#f06292;
  --accent:#7c4dff;
  --bg:#fafafa;
  --card:#fff;
  --ink:#212121;
  --muted:#757575;
  --success:#4caf50;
  --danger:#f44336;
  --super:#2196f3;
  --shadow:0 8px 32px rgba(0,0,0,.1);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Top Bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.06);z-index:10}
.logo{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:8px}
.tab{padding:8px 18px;border-radius:20px;border:none;background:none;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s;position:relative}
.tab.active{background:var(--primary);color:#fff}
.tab .badge{position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;font-size:.65rem;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.tab.active .badge{background:#fff;color:var(--primary)}

/* ── Main ── */
.main{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .3s}
.panel.hidden{opacity:0;pointer-events:none;transform:scale(.95)}

/* ── Swipe Deck ── */
.deck{position:relative;width:340px;height:480px}
.swipe-card{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--card);cursor:grab;user-select:none;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s}
.swipe-card:active{cursor:grabbing}
.swipe-card .photo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.swipe-card .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.swipe-card .name{font-size:1.6rem;font-weight:800;color:#fff}
.swipe-card .age{font-size:1.6rem;font-weight:300;color:#fff}
.swipe-card .bio{color:rgba(255,255,255,.85);font-size:.9rem;margin-top:6px;line-height:1.4}
.swipe-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.swipe-card .tag{background:rgba(255,255,255,.2);backdrop-filter:blur(4px);color:#fff;font-size:.75rem;padding:4px 10px;border-radius:12px}
.swipe-card .stamp{position:absolute;top:50%;transform:translateY(-50%) rotate(-15deg);font-size:3rem;font-weight:900;opacity:0;transition:opacity .2s;padding:8px 20px;border:4px solid;border-radius:12px}
.swipe-card .stamp.like{color:var(--success);border-color:var(--success);left:30px}
.swipe-card .stamp.pass{color:var(--danger);border-color:var(--danger);right:30px;transform:translateY(-50%) rotate(15deg)}
.swipe-card .stamp.super{color:var(--super);border-color:var(--super);left:50%;transform:translate(-50%,-50%) rotate(-10deg)}

/* ── Action Buttons ── */
.actions{display:flex;gap:16px;justify-content:center;margin-top:28px}
.action-btn{width:60px;height:60px;border-radius:50%;border:none;font-size:1.5rem;cursor:pointer;display:grid;place-items:center;transition:.2s;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.action-btn:hover{transform:scale(1.15)}
.action-btn:active{transform:scale(.95)}
.action-btn.pass{background:var(--card);color:var(--danger)}
.action-btn.super{background:var(--card);color:var(--super);width:50px;height:50px;font-size:1.2rem}
.action-btn.like{background:var(--card);color:var(--success)}
.action-btn.undo{background:var(--card);color:var(--muted);width:44px;height:44px;font-size:1rem}

/* ── Matches Panel ── */
.matches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;max-width:600px;width:100%;padding:24px;overflow-y:auto;max-height:100%}
.match-card{text-align:center;cursor:pointer;transition:.3s}
.match-card:hover{transform:translateY(-4px)}
.match-card img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);margin-bottom:8px}
.match-card .name{font-weight:700;font-size:.9rem}
.match-card .status{font-size:.75rem;color:var(--success)}

/* ── Chat Panel ── */
.chat-container{width:100%;max-width:500px;height:100%;display:flex;flex-direction:column;background:var(--card)}
.chat-header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}
.chat-header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chat-header .info{font-weight:700}
.chat-header .online{font-size:.75rem;color:var(--success)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:75%;padding:10px 16px;border-radius:18px;font-size:.9rem;line-height:1.4;animation:msgIn .3s}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#f0f0f0;border-bottom-left-radius:4px}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-input{display:flex;gap:10px;padding:14px 20px;border-top:1px solid #eee}
.chat-input input{flex:1;border:1px solid #e0e0e0;border-radius:24px;padding:10px 18px;font-size:.9rem;outline:none;transition:border .2s}
.chat-input input:focus{border-color:var(--primary)}
.chat-input button{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:1.1rem;cursor:pointer;transition:.2s}
.chat-input button:hover{transform:scale(1.1)}

/* ── Empty state ── */
.empty{text-align:center;color:var(--muted);padding:40px}
.empty .icon{font-size:3rem;margin-bottom:12px}

/* ── Responsive ── */
@media(max-width:500px){
  .deck{width:calc(100vw - 40px);height:calc(100vh - 260px)}
  .matches-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Connect</div>
  <div class="tabs">
    <button class="tab active" data-tab="swipe">Discover</button>
    <button class="tab" data-tab="matches">Matches <span class="badge" id="match-badge">0</span></button>
    <button class="tab" data-tab="chat">Chats</button>
  </div>
</div>

<div class="main">
  <!-- Swipe Panel -->
  <div class="panel" id="panel-swipe">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="deck" id="deck"></div>
      <div class="actions">
        <button class="action-btn undo" onclick="undo()" title="Undo">↩</button>
        <button class="action-btn pass" onclick="swipe('pass')" title="Pass">✕</button>
        <button class="action-btn super" onclick="swipe('super')" title="Super Like">★</button>
        <button class="action-btn like" onclick="swipe('like')" title="Like">♥</button>
      </div>
    </div>
  </div>

  <!-- Matches Panel -->
  <div class="panel hidden" id="panel-matches">
    <div class="matches-grid" id="matches-grid"></div>
  </div>

  <!-- Chat Panel -->
  <div class="panel hidden" id="panel-chat">
    <div class="chat-container" id="chat-container">
      <div class="chat-header" id="chat-header" style="display:none">
        <img id="chat-avatar" src="" alt="">
        <div><div class="info" id="chat-name"></div><div class="online">● Online</div></div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input" id="chat-input-row" style="display:none">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button onclick="sendMessage()">➤</button>
      </div>
      <div class="empty" id="chat-empty"><div class="icon">💬</div><p>No conversations yet.<br>Match with someone to start chatting!</p></div>
    </div>
  </div>
</div>

<script>
/* ── Profile Data ── */
const profiles = [
  {id:1,name:"Sarah",age:26,bio:"Love hiking, coffee & good books. Looking for someone to explore the world with.",tags:["Hiking","Coffee","Travel"],photo:"https://i.pravatar.cc/680?img=1"},
  {id:2,name:"Emma",age:24,bio:"Foodie 🍕 | Yoga enthusiast | Always down for a road trip",tags:["Food","Yoga","Music"],photo:"https://i.pravatar.cc/680?img=5"},
  {id:3,name:"Olivia",age:28,bio:"Art teacher by day, painter by night. Let's get lost in a gallery.",tags:["Art","Wine","Dancing"],photo:"https://i.pravatar.cc/680?img=9"},
  {id:4,name:"Mia",age:25,bio:"Nurse 🩺 | Dog mom 🐕 | Sunday brunch is non-negotiable",tags:["Dogs","Brunch","Fitness"],photo:"https://i.pravatar.cc/680?img=10"},
  {id:5,name:"Lily",age:27,bio:"Software engineer who actually likes cooking. Yes, really.",tags:["Coding","Cooking","Camping"],photo:"https://i.pravatar.cc/680?img=16"},
  {id:6,name:"Ava",age:23,bio:"Film student 🎬 | Indie music | Will debate the best pizza topping forever",tags:["Film","Music","Pizza"],photo:"https://i.pravatar.cc/680?img=20"},
  {id:7,name:"Zoe",age:29,bio:"Marathon runner 🏃‍♀️ | Plant parent 🌿 | Seeking my adventure partner",tags:["Running","Plants","Adventure"],photo:"https://i.pravatar.cc/680?img=25"},
  {id:8,name:"Chloe",age:26,bio:"Photographer 📸 | Coffee snob | Let's find the best hidden spots in town",tags:["Photo","Coffee","Exploring"],photo:"https://i.pravatar.cc/680?img=23"}
];

let deckIndex = 0;
let history = [];
let matches = [];
let currentChat = null;

/* ── Render Deck ── */
function renderDeck(){
  const deck = document.getElementById("deck");
  deck.innerHTML = "";
  // Show top 3 cards
  for(let i = Math.min(deckIndex+2, profiles.length-1); i >= deckIndex; i--){
    const p = profiles[i];
    const card = document.createElement("div");
    card.className = "swipe-card";
    card.dataset.index = i;
    card.style.zIndex = deckIndex+2-i;
    card.style.transform = `scale(${1-(deckIndex+2-i)*0.04}) translateY(${(deckIndex+2-i)*8}px)`;
    card.innerHTML = `
      <img class="photo" src="${p.photo}" alt="${p.name}">
      <div class="overlay">
        <div><span class="name">${p.name}</span> <span class="age">${p.age}</span></div>
        <div class="bio">${p.bio}</div>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <div class="stamp like">LIKE</div>
      <div class="stamp pass">PASS</div>
      <div class="stamp super">SUPER</div>
    `;
    attachDrag(card);
    deck.appendChild(card);
  }
  if(deckIndex >= profiles.length){
    deck.innerHTML = `<div class="empty" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="icon">🎉</div><p>You've seen everyone!<br>Check your matches.</p></div>`;
  }
}

/* ── Drag to Swipe ── */
function attachDrag(card){
  let startX, startY, dx, dy, dragging = false;
  const start = (x,y)=>{ dragging=true; startX=x; startY=y; card.style.transition="none"; };
  const move = (x,y)=>{
    if(!dragging) return;
    dx = x-startX; dy = y-startY;
    const rot = dx*0.08;
    card.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`;
    // Show stamps
    const like = card.querySelector(".stamp.like");
    const pass = card.querySelector(".stamp.pass");
    like.style.opacity = dx > 50 ? dx/200 : 0;
    pass.style.opacity = dx < -50 ? -dx/200 : 0;
  };
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    card.style.transition = "";
    if(dx > 100) doSwipe(card, "like");
    else if(dx < -100) doSwipe(card, "pass");
    else if(dy < -150) doSwipe(card, "super");
    else {
      card.style.transform = `scale(${parseFloat(card.style.transform.match(/scale\(([\d.]+)/)?.[1]||1)}) translateY(${(deckIndex+2-parseInt(card.dataset.index))*8}px)`;
      card.querySelector(".stamp.like").style.opacity = 0;
      card.querySelector(".stamp.pass").style.opacity = 0;
      card.querySelector(".stamp.super").style.opacity = 0;
    }
    dx = dy = 0;
  };

  card.addEventListener("mousedown", e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
  window.addEventListener("mousemove", e=>move(e.clientX,e.clientY));
  window.addEventListener("mouseup", end);
  card.addEventListener("touchstart", e=>{ start(e.touches[0].clientX,e.touches[0].clientY); });
  card.addEventListener("touchmove", e=>{ e.preventDefault(); move(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
  card.addEventListener("touchend", end);
}

/* ── Swipe Action ── */
function swipe(dir){
  const topCard = document.querySelector(".swipe-card");
  if(!topCard) return;
  doSwipe(topCard, dir);
}

function doSwipe(card, dir){
  const p = profiles[deckIndex];
  history.push({profile:p, dir});
  const stamp = card.querySelector(`.stamp.${dir}`);
  if(stamp) stamp.style.opacity = 1;

  if(dir==="like" || dir==="super"){
    // 60% chance of mutual match for demo
    if(Math.random() < 0.6){
      matches.push(p);
      updateMatchBadge();
    }
  }

  const tx = dir==="pass" ? -600 : dir==="super" ? 0 : 600;
  const ty = dir==="super" ? -700 : 0;
  const rot = dir==="pass" ? -30 : dir==="like" ? 30 : 0;
  card.style.transform = `translate(${tx}px,${ty}px) rotate(${rot}deg)`;
  card.style.opacity = "0";

  deckIndex++;
  setTimeout(renderDeck, 400);
}

function undo(){
  if(history.length === 0) return;
  const last = history.pop();
  if(last.dir==="like" || last.dir==="super"){
    matches = matches.filter(m=>m.id!==last.profile.id);
    updateMatchBadge();
  }
  deckIndex--;
  renderDeck();
}

/* ── Tabs ── */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab;
    document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
    document.getElementById(`panel-${target}`).classList.remove("hidden");
    if(target==="matches") renderMatches();
    if(target==="chat") renderChatPanel();
  };
});

/* ── Matches ── */
function updateMatchBadge(){
  document.getElementById("match-badge").textContent = matches.length;
}
function renderMatches(){
  const grid = document.getElementById("matches-grid");
  if(matches.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">💘</div><p>No matches yet.<br>Keep swiping!</p></div>`;
    return;
  }
  grid.innerHTML = matches.map(m=>`
    <div class="match-card" onclick="openChat(${m.id})">
      <img src="${m.photo}" alt="${m.name}">
      <div class="name">${m.name}, ${m.age}</div>
      <div class="status">It's a match!</div>
    </div>
  `).join("");
}

/* ── Chat ── */
function openChat(id){
  const m = matches.find(x=>x.id===id);
  if(!m) return;
  currentChat = m;
  // Switch to chat tab
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelector('[data-tab="chat"]').classList.add("active");
  document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
  document.getElementById("panel-chat").classList.remove("hidden");
  renderChatPanel();
}

function renderChatPanel(){
  const header = document.getElementById("chat-header");
  const msgs = document.getElementById("chat-messages");
  const inputRow = document.getElementById("chat-input-row");
  const empty = document.getElementById("chat-empty");

  if(!currentChat){
    header.style.display="none";
    inputRow.style.display="none";
    empty.style.display="block";
    msgs.innerHTML="";
    return;
  }
  empty.style.display="none";
  header.style.display="flex";
  inputRow.style.display="flex";
  document.getElementById("chat-avatar").src = currentChat.photo;
  document.getElementById("chat-name").textContent = currentChat.name;

  // Demo messages
  const demoMsgs = [
    {from:"them", text:`Hey! I saw we matched 😊`},
    {from:"them", text:`I noticed you both like ${currentChat.tags[0].toLowerCase()} — what got you into it?`}
  ];
  msgs.innerHTML = demoMsgs.map(m=>`<div class="msg ${m.from}">${m.text}</div>`).join("");
  msgs.scrollTop = msgs.scrollHeight;
}

function sendMessage(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text || !currentChat) return;
  const msgs = document.getElementById("chat-messages");
  msgs.innerHTML += `<div class="msg me">${text}</div>`;
  input.value = "";
  msgs.scrollTop = msgs.scrollHeight;
  // Simulated reply
  setTimeout(()=>{
    const replies = ["Haha that's awesome! 😄","Tell me more!","I was actually just thinking about that today!","Let's grab coffee this week? ☕","Haha I love that!"];
    msgs.innerHTML += `<div class="msg them">${replies[Math.floor(Math.random()*replies.length)]}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
  }, 1200 + Math.random()*1000);
}
document.getElementById("chat-input").addEventListener("keydown",e=>{ if(e.key==="Enter") sendMessage(); });

/* ── Init ── */
renderDeck();
</script>
</body>
</html>
